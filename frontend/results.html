<title>Results | NSosyal Ses-El</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
<link rel="icon" type="image/svg+xml" href="images/sesel-icon.svg" />
<link rel="stylesheet" href="css/style.css" />

<header class="site-header">
  <nav class="nav">
    <a class="nav-brand" href="index.html"><img src="images/sesel-icon.svg" alt="" class="nav-brand-icon" /><span data-t="nav.brand">NSosyal</span> <span class="brand-suffix" data-t="nav.brandSuffix">Ses-El</span></a>
    <div class="nav-links">
      <a href="index.html" data-t="nav.home">Home</a>
      <a href="demo.html" data-t="nav.demo">Text demo</a>
      <a href="vocabulary.html" data-t="nav.vocabulary">Vocabulary</a>
      <a href="about.html" data-t="nav.about">About & limits</a>
      <span class="nav-sep">|</span>
      <select id="locale-toggle" class="nav-locale" aria-label="Language">
        <option value="tr">TR</option>
        <option value="en">EN</option>
      </select>
      <button id="theme-toggle" class="nav-theme" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </nav>
</header>

<main>
  <div class="container">
    <div id="no-result" style="display:none;">
      <p class="eyebrow" data-t="results.noResultEyebrow"></p>
      <h1 data-t="results.noResultTitle"></h1>
      <p class="lede" data-t="results.noResultBody" data-t-html></p>
    </div>

    <div id="result-view" style="display:none;">
      <p class="eyebrow" data-t="results.eyebrow"></p>
      <h1 data-t="results.title"></h1>

      <div class="stat-row">
        <div class="stat"><div class="n" id="stat-matched">0</div><div class="l" data-t="results.statMatched"></div></div>
        <div class="stat"><div class="n" id="stat-total">0</div><div class="l" data-t="results.statTotal"></div></div>
        <div class="stat"><div class="n" id="stat-pct">0%</div><div class="l" data-t="results.statCoverage"></div></div>
      </div>

      <div class="mode-toggle">
        <button id="mode-signs" class="active" type="button" data-t="results.modeSigns"></button>
        <button id="mode-pip" type="button" data-t="results.modePip"></button>
      </div>

      <div id="signs-only-mode">
        <div class="sign-stage" id="sign-stage-standalone"></div>
        <div class="timeline-scrub" id="scrub-standalone" data-t="results.scrubIdle"></div>
        <p class="faint" style="margin-top:12px;" data-t="results.standaloneNote"></p>
      </div>

      <div id="pip-mode" style="display:none;">
        <div class="video-pip-wrap">
          <video id="result-video" controls></video>
          <div class="pip-overlay" id="sign-stage-pip"></div>
        </div>
        <p class="faint" style="margin-top:12px;" data-t="results.pipNote"></p>
      </div>

      <hr />

      <section id="feedback-section">
        <p class="eyebrow" data-t="results.feedbackEyebrow"></p>
        <h2 data-t="results.feedbackTitle"></h2>
        <div class="rating" id="rating-buttons">
          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
        </div>
        <div class="field">
          <label for="feedback-text" data-t="results.feedbackTextLabel"></label>
          <textarea id="feedback-text" data-t-placeholder="results.feedbackPlaceholder"></textarea>
        </div>
        <button class="btn btn-primary" id="feedback-submit" type="button" data-t="results.feedbackSubmit"></button>
        <div class="status-line" id="feedback-status"></div>
      </section>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-grid">
    <div class="footer-col">
      <h4 data-t="footer.productHeading"></h4>
      <a href="index.html" data-t="footer.productUpload"></a>
      <a href="demo.html" data-t="footer.productDemo"></a>
      <a href="vocabulary.html" data-t="footer.productVocab"></a>
    </div>
    <div class="footer-col">
      <h4 data-t="footer.projectHeading"></h4>
      <a href="about.html" data-t="footer.projectAbout"></a>
    </div>
  </div>
  <div class="footer-note">
    <span data-t="footer.metaLine"></span>
    <div style="margin-top:8px;" data-t="footer.note" data-t-html></div>
  </div>
</footer>

<script src="js/app.js"></script>
<script src="js/sign-avatar.js"></script>
<script src="js/results.js"></script>
