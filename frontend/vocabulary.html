<main>
  <div class="container">
    <p class="eyebrow" data-t="vocabulary.eyebrow"></p>
    <h1 data-t="vocabulary.title"></h1>
    <p class="lede" data-t="vocabulary.lede"></p>

    <div class="callout">
      <strong id="vocab-count">0</strong> <span data-t="vocabulary.calloutSuffix"></span>
    </div>

    <div class="field" style="max-width: 320px;">
      <label for="vocab-filter" data-t="vocabulary.filterLabel"></label>
      <input type="text" id="vocab-filter" data-t-placeholder="vocabulary.filterPlaceholder" />
    </div>

    <table>
      <thead>
        <tr>
          <th data-t="vocabulary.tableText"></th>
          <th data-t="vocabulary.tableGloss"></th>
          <th data-t="vocabulary.tableId"></th>
        </tr>
      </thead>
      <tbody id="vocab-body"></tbody>
    </table>
  </div>
</main>
